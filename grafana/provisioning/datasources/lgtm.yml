apiVersion: 1

datasources:
  - name: Loki
    uid: P8E80F9AEF21F6940
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      manageAlerts: false
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([a-f0-9]{32})"'
          datasourceUid: P214B5B846CF3925F
          url: "$${__value.raw}"
          urlDisplayLabel: View trace
  - name: Tempo
    uid: P214B5B846CF3925F
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: P8E80F9AEF21F6940
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: '{job="fabricius-api"} | json | line_format "{{.body}}" | json | trace_id="$${__span.traceId}"'
      nodeGraph:
        enabled: true
  - name: Mimir
    uid: PAE45454D0EDB9216
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    jsonData:
      manageAlerts: false
      httpHeaderName1: X-Scope-OrgID
      timeInterval: 15s
    secureJsonData:
      httpHeaderValue1: fabricius
