services:
  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./monitoring/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  mimir:
    image: grafana/mimir:2.16.0
    command: ["-config.file=/etc/mimir/mimir-config.yaml"]
    ports:
      - "9009:9009"
    volumes:
      - ./monitoring/mimir-config.yaml:/etc/mimir/mimir-config.yaml:ro
      - ./monitoring/mimir-rules:/var/mimir/rules
      - mimir-data:/var/mimir
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.11.3
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--storage.path=/var/lib/alloy/data",
        "/etc/alloy/config.alloy",
      ]
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:12345:12345"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_ENVIRONMENT: ${NODE_ENV:-development}
      API_INSTANCE: ${OTEL_SERVICE_INSTANCE_ID:-local-api}
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
      - mimir
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - mimir
    restart: unless-stopped

volumes:
  alloy-data:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
